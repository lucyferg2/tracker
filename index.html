<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lucy's daily tracker</title>
<meta name="theme-color" content="#33202A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily tracker">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --paper:#F6EEF0; --card:#FCF7F8; --ink:#21151A; --night:#33202A;
    --night-ink:#EBDCE1; --signal:#A5335F; --signal-lt:#F2A3C0; --warn:#8F5516;
    --warn-lt:#E8B268; --muted:#7B6670; --rule:#E2CDD4;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.5;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:620px;margin:0 auto;padding:22px 16px 56px;}
  button{font:inherit;color:inherit;cursor:pointer;}
  button:focus-visible{outline:2px solid var(--signal);outline-offset:2px;}
  .pm button:focus-visible{outline-color:var(--signal-lt);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  .masthead{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;}
  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  h1{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.1;margin:0;}

  .day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .num{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--signal);font-weight:600;}
  .meta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-left:auto;}

  .nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .nav button{width:38px;height:38px;border-radius:3px;border:1px solid var(--rule);background:none;font-size:16px;}
  .nav button:disabled{color:var(--rule);cursor:default;}
  .date{flex:1;text-align:center;font-family:var(--display);font-size:19px;}
  .today-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--signal);margin-top:2px;}
  .jump{width:100%;margin-bottom:14px;padding:7px;background:none;border:1px solid var(--rule);border-radius:3px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);}

  .slot{border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin-top:10px;}
  .slot.pm{background:var(--night);color:var(--night-ink);border-color:var(--night);}
  .slot.fit{border-left:3px solid var(--signal);}
  .slot-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;opacity:.6;margin-bottom:8px;}
  .row{display:flex;align-items:flex-start;gap:10px;width:100%;background:none;border:none;padding:8px 0;text-align:left;}
  .row + .row{border-top:1px solid var(--rule);}
  .pm .row + .row{border-top-color:rgba(255,255,255,.09);}
  .box{flex:0 0 auto;width:19px;height:19px;margin-top:1px;border-radius:3px;border:1.5px solid var(--rule);
       display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;color:#fff;}
  .pm .box{border-color:rgba(255,255,255,.3);}
  .row.done .box{background:var(--signal);border-color:var(--signal);}
  .pm .row.done .box{background:var(--signal-lt);border-color:var(--signal-lt);color:var(--night);}
  .txt{font-size:14px;}
  .row.done .txt{opacity:.45;text-decoration:line-through;}

  .flag{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:11px 13px;
    background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--signal);border-radius:3px;}
  .flag-txt{flex:1;font-size:13px;}
  .flag-txt b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--signal);margin-bottom:3px;}
  .flag button{flex:0 0 auto;padding:8px 12px;border-radius:3px;border:none;background:var(--signal);
    color:#fff;font-family:var(--mono);font-size:10px;letter-spacing:.1em;}

  .grid-wrap{margin-top:28px;padding-top:18px;border-top:2px solid var(--ink);}
  .grid-head{display:flex;align-items:baseline;margin-bottom:12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .grid-head span:last-child{margin-left:auto;letter-spacing:.06em;}
  .dots{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .dot{aspect-ratio:1;border-radius:3px;border:1px solid var(--rule);background:none;color:var(--muted);font-family:var(--mono);font-size:9px;padding:0;}
  .dot.part{background:#EFC3D4;}
  .dot.full{background:var(--signal);color:#fff;border-color:var(--signal);}
  .dot.today{border:1.5px dashed var(--signal);}
  .dot.cur{border:2px solid var(--ink);}
  .export{width:100%;margin-top:14px;padding:8px;background:none;border:1px solid var(--rule);
    border-radius:3px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);}

  footer{margin-top:20px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);line-height:1.7;}
  footer button{background:none;border:none;padding:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  /* ---------- schedule ---------- */

  var START = new Date(2026, 8, 18);   // Friday 18 September 2026
  var TOTAL = 30;
  var STORE = "skincare-fitness-v1";

  // 30-day Pilates challenge, one video a day, 20 mins each
  var PILATES = [
    "Abs & Fat Burn", "Full Body Sculpt with Weights", "Core Strength & Tone",
    "Legs & Thighs", "Full Body Mobility Flow", "Full Body Pilates Routine",
    "Upper Body & Core",
    "Hourglass Waist", "Full Body Sculpt", "Six Pack Abs",
    "Thighs, Glutes & Hamstrings", "Physio-Led Full Body Stretch",
    "Traditional Mat Pilates", "Back & Core",
    "Classic Abs Routine", "Full Body HIIT, Low Impact", "11 Line Abs",
    "Legs & Glutes, Mat Pilates", "Back Pain Relief Mobility",
    "Full Body Flow with Dumbbells", "Core, Shoulders & Back",
    "Deep Core & Waist", "Pilates x Strength", "11 Line Abs, No Equipment",
    "Glutes, Lift & Tone", "Lower Body Mobility with Physio",
    "Fat Burn Strength, Low Impact", "Arms & Core, Mat Pilates",
    "Abs Intense Routine", "Pilates & Low Impact Strength"
  ];

  // Runs land on Fridays, Sundays and Wednesdays, alternating 5k and intervals
  var RUNS = {
    0:  "Run \u2014 5K",
    2:  "Run \u2014 intervals (20 min)",
    5:  "Run \u2014 5K",
    7:  "Run \u2014 intervals (30 min)",
    9:  "Run \u2014 5K",
    12: "Run \u2014 intervals (25 min)",
    14: "Run \u2014 5K",
    16: "Run \u2014 intervals (40 min)",
    19: "Run \u2014 5K",
    21: "Run \u2014 intervals (20 min)",
    23: "Run \u2014 5K",
    26: "Run \u2014 intervals (30 min)",
    28: "Run \u2014 5K"
  };

  function dateFor(i) { var d = new Date(START); d.setDate(START.getDate() + i); return d; }
  function keyFor(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function todayIndex() {
    var n = new Date();
    var a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
    var b = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.min(Math.max(Math.round((b - a) / 86400000), 0), TOTAL - 1);
  }

  function buildDay(i) {
    var d = dateFor(i);
    var wd = d.getDay(); // 0 Sun .. 6 Sat
    var am = [], pm = [], fit = [];

    am.push({ t: "La Roche-Posay toner" });
    am.push({ t: "Beauty of Joseon moisturiser + SPF" });

    pm.push({ t: "La Roche-Posay toner" });
    if (wd === 1 || wd === 5) {          // Mon, Fri
      pm.push({ t: "The Ordinary retinol" });
      pm.push({ t: "Night moisturiser" });
    } else if (wd === 3) {               // Wed
      pm.push({ t: "La Roche-Posay salicylic acid toner" });
      pm.push({ t: "Night moisturiser" });
    } else if (wd === 6) {               // Sat
      pm.push({ t: "Glycolic acid toner" });
      pm.push({ t: "Night moisturiser" });
    } else {                             // Tue, Thu, Sun
      pm.push({ t: "The Ordinary azelaic acid \u2014 let it set 1 min" });
      pm.push({ t: "Niacinamide serum" });
      pm.push({ t: "Night moisturiser" });
    }

    fit.push({ t: "Pilates \u2014 " + PILATES[i] + " (20 min)" });
    if (RUNS[i]) fit.push({ t: RUNS[i] });
    fit.push({ t: "Stretch (10 min)" });

    return { am: am, pm: pm, fit: fit };
  }

  var DAYS = [];
  for (var n = 0; n < TOTAL; n++) DAYS.push(buildDay(n));

  /* ---------- state ---------- */

  var state = { checks: {}, lastExport: null };
  var index = todayIndex();
  var storageOK = true;

  try {
    var raw = window.localStorage.getItem(STORE);
    if (raw) {
      var p = JSON.parse(raw);
      state.checks = p.checks || {};
      state.lastExport = p.lastExport || null;
    }
  } catch (e) { storageOK = false; }

  function save() {
    try { window.localStorage.setItem(STORE, JSON.stringify(state)); }
    catch (e) { storageOK = false; }
  }

  /* ---------- helpers ---------- */

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function progressOf(i) {
    var d = DAYS[i], k = keyFor(dateFor(i)), done = 0;
    var total = d.am.length + d.pm.length + d.fit.length;
    d.am.forEach(function (_, j) { if (state.checks[k + ":am:" + j]) done++; });
    d.pm.forEach(function (_, j) { if (state.checks[k + ":pm:" + j]) done++; });
    d.fit.forEach(function (_, j) { if (state.checks[k + ":fit:" + j]) done++; });
    return { done: done, total: total };
  }

  /* ---------- render ---------- */

  function render() {
    var app = document.getElementById("app");
    app.textContent = "";

    var day = DAYS[index], date = dateFor(index), dk = keyFor(date);
    var ti = todayIndex();

    // masthead
    var mh = el("div", "masthead");
    mh.appendChild(el("div", "kicker", "One month \u00b7 18 Sep \u2013 17 Oct"));
    mh.appendChild(el("h1", null, "Lucy's daily tracker"));
    app.appendChild(mh);

    // day counter
    var dh = el("div", "day-head");
    dh.appendChild(el("span", "num", "DAY " + (index + 1)));
    dh.appendChild(el("span", "meta", "OF " + TOTAL));
    app.appendChild(dh);

    // nav
    var nav = el("div", "nav");
    var prev = el("button", null, "\u2190");
    prev.disabled = index === 0;
    prev.setAttribute("aria-label", "Previous day");
    prev.onclick = function () { index--; render(); };
    var next = el("button", null, "\u2192");
    next.disabled = index === TOTAL - 1;
    next.setAttribute("aria-label", "Next day");
    next.onclick = function () { index++; render(); };
    var mid = el("div", "date");
    mid.textContent = date.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    if (index === ti) mid.appendChild(el("div", "today-tag", "TODAY"));
    nav.appendChild(prev); nav.appendChild(mid); nav.appendChild(next);
    app.appendChild(nav);

    if (index !== ti) {
      var jump = el("button", "jump", "BACK TO TODAY");
      jump.onclick = function () { index = todayIndex(); render(); };
      app.appendChild(jump);
    }

    var flag = exportFlag();
    if (flag) app.appendChild(flag);

    app.appendChild(slotBlock("AM", day.am, dk, "am", ""));
    app.appendChild(slotBlock("FITNESS", day.fit, dk, "fit", " fit"));
    app.appendChild(slotBlock("PM", day.pm, dk, "pm", " pm"));

    // 30-day grid
    var gw = el("div", "grid-wrap");
    var gh = el("div", "grid-head");
    gh.appendChild(el("span", null, "All thirty days"));
    var pr = progressOf(index);
    gh.appendChild(el("span", null, pr.done + "/" + pr.total + " today"));
    gw.appendChild(gh);

    var dots = el("div", "dots");
    for (var m = 0; m < TOTAL; m++) {
      (function (i) {
        var pg = progressOf(i);
        var cls = "dot" + (pg.done === 0 ? "" : pg.done === pg.total ? " full" : " part");
        if (i === ti) cls += " today";
        if (i === index) cls += " cur";
        var d = el("button", cls, String(dateFor(i).getDate()));
        d.setAttribute("aria-label", "Day " + (i + 1));
        d.onclick = function () { index = i; render(); };
        dots.appendChild(d);
      })(m);
    }
    gw.appendChild(dots);

    var exp = el("button", "export", "EXPORT ALL 30 DAYS AS CSV");
    exp.onclick = exportCsv;
    gw.appendChild(exp);
    app.appendChild(gw);

    // footer
    var f = el("footer");
    f.appendChild(document.createTextNode(storageOK
      ? "TICKS SAVE TO THIS DEVICE"
      : "STORAGE UNAVAILABLE \u2014 TICKS WON'T PERSIST HERE"));
    f.appendChild(el("br"));
    f.appendChild(document.createTextNode("NEVER TWO ACIDS, OR ACID PLUS RETINOL, ON ONE NIGHT"));
    f.appendChild(el("br"));
    f.appendChild(document.createTextNode(state.lastExport
      ? "LAST EXPORT " + state.lastExport
      : "NEVER EXPORTED"));
    f.appendChild(el("br"));
    var reset = el("button", null, "Reset all progress");
    reset.onclick = function () {
      if (window.confirm("Clear every tick? This can't be undone.")) {
        state = { checks: {}, lastExport: null };
        save(); render();
      }
    };
    f.appendChild(reset);
    app.appendChild(f);
  }

  function slotBlock(label, items, dk, slot, extraCls) {
    var wrap = el("div", "slot" + extraCls);
    wrap.appendChild(el("div", "slot-label", label));
    items.forEach(function (item, n) {
      var k = dk + ":" + slot + ":" + n;
      var on = !!state.checks[k];
      var row = el("button", "row" + (on ? " done" : ""));
      row.setAttribute("aria-pressed", on ? "true" : "false");
      var box = el("span", "box", on ? "\u2713" : "");
      var txt = el("span", "txt");
      txt.appendChild(document.createTextNode(item.t));
      row.appendChild(box); row.appendChild(txt);
      row.onclick = function () {
        if (state.checks[k]) delete state.checks[k]; else state.checks[k] = true;
        save(); render();
      };
      wrap.appendChild(row);
    });
    return wrap;
  }

  function daysSince(isoKey) {
    var parts = isoKey.split("-");
    var then = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    var now = new Date();
    now = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((now - then) / 86400000);
  }

  // nudge on Sundays, and again if a week has slipped by without a backup
  function exportFlag() {
    var ti = todayIndex(), t = dateFor(ti), tk = keyFor(t);
    if (state.lastExport === tk) return null;

    var isSunday = t.getDay() === 0;
    var gap = state.lastExport ? daysSince(state.lastExport) : ti;
    var stale = gap >= 7;
    if (!isSunday && !stale) return null;

    var wrap = el("div", "flag");
    var txt = el("div", "flag-txt");
    txt.appendChild(el("b", null, isSunday ? "Sunday" : "Backup overdue"));
    txt.appendChild(document.createTextNode(
      state.lastExport
        ? "Last export was " + gap + (gap === 1 ? " day ago." : " days ago.")
        : "Nothing backed up yet. Export the log so a wipe can't cost you it."
    ));
    wrap.appendChild(txt);

    var b = el("button", null, "EXPORT");
    b.onclick = exportCsv;
    wrap.appendChild(b);
    return wrap;
  }

  function exportCsv() {
    var rows = [["date", "day", "weekday", "pilates", "run", "done", "total"]];
    for (var i = 0; i < TOTAL; i++) {
      var d = dateFor(i), k = keyFor(d), pg = progressOf(i);
      rows.push([
        k,
        i + 1,
        d.toLocaleDateString("en-GB", { weekday: "short" }),
        PILATES[i],
        RUNS[i] || "",
        pg.done,
        pg.total
      ]);
    }
    var csv = rows.map(function (r) {
      return r.map(function (c) {
        c = String(c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(",");
    }).join("\n");

    try {
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "month-log.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      window.prompt("Copy the CSV:", csv);
    }
    state.lastExport = keyFor(new Date());
    save();
    render();
  }

  render();

  // refresh the "today" marker if the app is left open overnight
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
